[package]
name = "au05-desk"
version = "0.8.0"
edition = "2021"
[features]
custom-protocol = ["tauri/custom-protocol"]
[build-dependencies]
tauri-build = "2"
[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = {version="1", features=["derive"]}
serde_json="1"
sha2="0.10"
uuid={version="1",features=["v4"]}
rusqlite={version="0.37",features=["bundled"]}
tokio={version="1",features=["net","time","io-util","rt-multi-thread","macros"]}
chrono={version="0.4",features=["serde"]}
cpal="0.15"
base64="0.22"
[target.'cfg(windows)'.dependencies]
hidapi = { version="2.6", default-features=false,features=["windows-native"] }
windows-sys={version="0.59",features=["Win32_Graphics_Gdi","Win32_Graphics_Dwm","Win32_System_Diagnostics_ToolHelp","Win32_System_RemoteDesktop","Win32_Foundation","Win32_UI_Input_KeyboardAndMouse","Win32_UI_WindowsAndMessaging","Win32_Security","Win32_Security_Authorization","Win32_System_Threading","Win32_System_Memory","Win32_UI_Shell","Win32_Storage_Packaging_Appx"]}
[target.'cfg(target_os="macos")'.dependencies]
hidapi = { version="2.6", default-features=false, features=["macos-shared-device"] }
